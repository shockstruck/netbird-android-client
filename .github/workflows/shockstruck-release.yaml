name: shockstruck release

# Fork-only. The build job runs upstream's composite action, which needs a
# signing config, so it signs with a throwaway key generated in $RUNNER_TEMP
# (the build holds no real secret). The sign job then removes every trace of
# that signature, re-signs with the real release key using Android SDK tools
# only, proves the build key is gone, and publishes. No upstream code (Gradle,
# the composite action) ever runs where the real keystore exists.
# The sign job stays off until the repo variable SHOCKSTRUCK_RELEASE_ENABLED is
# 'true'; pull requests that touch this file run sign-dry-run, which does the
# same re-signing and checks with another ephemeral key and publishes nothing.
# Do not rename this file: that resets github.run_number, which feeds versionCode.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/shockstruck-release.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: shockstruck-release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      tag: ${{ steps.version.outputs.tag }}
      apk_name: ${{ steps.collect.outputs.apk_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Compute version from the built commit
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # The fork has no upstream tags of its own; fetch them so describe
          # names the upstream release this commit actually contains.
          git fetch --quiet --no-recurse-submodules https://github.com/netbirdio/android-client.git \
            '+refs/tags/*:refs/tags/*'
          if ! tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*shockstruck*' HEAD); then
            echo "::error::no upstream release tag is reachable from the built commit"
            exit 1
          fi
          upstream=${tag#v}
          # Upstream's Play version codes are two digits and grow by one per
          # release or snapshot run; the offset keeps fork codes far above them.
          version_code=$((100000 + RUN_NUMBER))
          version_name="${upstream}-shockstruck.${RUN_NUMBER}"
          {
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
            echo "tag=v${version_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Create the throwaway build key
        run: |
          set -euo pipefail
          pass=$(openssl rand -hex 16)
          echo "::add-mask::${pass}"
          keytool -genkeypair -keystore "$RUNNER_TEMP/build-key.jks" -storepass "$pass" -keypass "$pass" \
            -alias buildkey -keyalg RSA -keysize 3072 -validity 1 -dname "CN=shockstruck throwaway build key"
          {
            echo "NETBIRD_UPLOAD_STORE_FILE=$RUNNER_TEMP/build-key.jks"
            echo "NETBIRD_UPLOAD_STORE_PASSWORD=${pass}"
            echo "NETBIRD_UPLOAD_KEY_ALIAS=buildkey"
            echo "NETBIRD_UPLOAD_KEY_PASSWORD=${pass}"
          } >> "$GITHUB_ENV"

      - name: Build Android
        id: build
        uses: ./.github/actions/build-android
        with:
          version_name: ${{ steps.version.outputs.version_name }}
          version_code: ${{ steps.version.outputs.version_code }}
          build_type: release

      - name: Collect build-key APK
        id: collect
        env:
          APK_PATH: ${{ steps.build.outputs.apk_path }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$APK_PATH" out/build.apk
          echo "apk_name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload build-key APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-apk-buildkey
          path: out/build.apk
          retention-days: 3
          if-no-files-found: error

  sign-dry-run:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download build-key APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-apk-buildkey

      - name: Re-sign with an ephemeral key and prove the build key is gone
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -1)"
          KEYSTORE_PASS=$(openssl rand -hex 16)
          export KEYSTORE_PASS
          ks="$RUNNER_TEMP/dry-run.jks"
          keytool -genkeypair -keystore "$ks" -storepass:env KEYSTORE_PASS -keypass:env KEYSTORE_PASS \
            -alias dryrun -keyalg RSA -keysize 3072 -validity 1 -dname "CN=shockstruck dry run"
          expected=$(keytool -list -v -keystore "$ks" -storepass:env KEYSTORE_PASS -alias dryrun \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':' | tr 'A-F' 'a-f')

          # The build key's v1 signature files must not survive into the final
          # APK. Strip them before zipalign (zip -d would undo the alignment).
          # The v2/v3 signing block is replaced by apksigner below, which is told
          # not to add v1 files of its own.
          cp build.apk stripped.apk
          zip -q -d stripped.apk 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' || true
          "$bt/zipalign" -P 16 -f 4 stripped.apk aligned.apk
          "$bt/apksigner" sign --v1-signing-enabled false --ks "$ks" --ks-key-alias dryrun \
            --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS --out signed.apk aligned.apk

          "$bt/apksigner" verify --print-certs -v signed.apk | tee verify.txt
          grep -q '^Number of signers: 1$' verify.txt
          actual=$(sed -n 's/^.*certificate SHA-256 digest: //p' verify.txt | sort -u)
          echo "expected signer digest: ${expected}"
          echo "actual signer digest:   ${actual}"
          [ -n "$expected" ] && [ "$expected" = "$actual" ]
          if unzip -l signed.apk | grep -E 'META-INF/.*\.(SF|RSA|EC|DSA)$'; then
            echo "::error::v1 signature files remain in the final APK"
            exit 1
          fi
          "$bt/zipalign" -c -P 16 4 signed.apk
          echo "build key is gone: one signer, digest matches, no v1 signature files"

  sign:
    if: github.event_name != 'pull_request' && vars.SHOCKSTRUCK_RELEASE_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download build-key APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-apk-buildkey

      - name: Re-sign with the release key and prove the build key is gone
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 KEYSTORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then
              echo "::error::release signing secret for $v is missing or empty"
              exit 1
            fi
          done
          bt="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -1)"
          ks="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          trap 'rm -f "$ks"' EXIT
          expected=$(keytool -list -v -keystore "$ks" -storepass:env KEYSTORE_PASS -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':' | tr 'A-F' 'a-f')

          # The build key's v1 signature files must not survive into the final
          # APK. Strip them before zipalign (zip -d would undo the alignment).
          # The v2/v3 signing block is replaced by apksigner below, which is told
          # not to add v1 files of its own.
          cp build.apk stripped.apk
          zip -q -d stripped.apk 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' || true
          "$bt/zipalign" -P 16 -f 4 stripped.apk aligned.apk
          "$bt/apksigner" sign --v1-signing-enabled false --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASS --key-pass env:KEY_PASS --out "$APK_NAME" aligned.apk

          "$bt/apksigner" verify --print-certs -v "$APK_NAME" | tee verify.txt
          grep -q '^Number of signers: 1$' verify.txt
          actual=$(sed -n 's/^.*certificate SHA-256 digest: //p' verify.txt | sort -u)
          echo "expected signer digest: ${expected}"
          echo "actual signer digest:   ${actual}"
          [ -n "$expected" ] && [ "$expected" = "$actual" ]
          if unzip -l "$APK_NAME" | grep -E 'META-INF/.*\.(SF|RSA|EC|DSA)$'; then
            echo "::error::v1 signature files remain in the final APK"
            exit 1
          fi
          "$bt/zipalign" -c -P 16 4 "$APK_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$APK_NAME" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Fork build of upstream NetBird Android client at ${GITHUB_SHA}."
