name: shockstruck upstream sync

# Fork-only. Merges netbirdio/android-client main into an upstream-sync branch
# and opens or updates a PR to main, which build-debug validates. The jobs run
# git and gh only; they never run Gradle or any upstream script.
# The pushing job stays off until the repo variable SHOCKSTRUCK_SYNC_ENABLED is
# 'true'; until then dry-run reports what a sync would do and pushes nothing.
# Pull requests that touch this file run the dry run only, so a change to the
# sync is proven before it reaches the default branch.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/shockstruck-upstream-sync.yaml

permissions: {}

concurrency:
  group: shockstruck-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/netbirdio/android-client.git
  SYNC_BRANCH: upstream-sync

jobs:
  dry-run:
    if: vars.SHOCKSTRUCK_SYNC_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Test-merge upstream into main
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL"
          git fetch --quiet upstream main
          ahead=$(git rev-list --count HEAD..upstream/main)
          base=$(git merge-base HEAD upstream/main)
          gh_touched=no
          if [ -n "$(git diff --name-only "$base" upstream/main -- .github/)" ]; then gh_touched=yes; fi
          conflict=no
          if [ "$ahead" -gt 0 ]; then
            git config user.name "shockstruck-sync"
            git config user.email "noreply@users.noreply.github.com"
            if ! git merge --no-ff --no-edit upstream/main > /dev/null 2>&1; then conflict=yes; fi
          fi
          {
            echo "## Upstream sync dry run (gate off, nothing pushed)"
            echo "- upstream commits not on main: ${ahead}"
            echo "- upstream delta touches .github/: ${gh_touched}"
            echo "- merge conflict: ${conflict}"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  sync:
    if: github.event_name != 'pull_request' && vars.SHOCKSTRUCK_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: upstream-sync
    permissions:
      contents: read
      issues: write
    steps:
      - name: Mint sync App token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Merge upstream and open or update the PR
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The App token only pushes the branch and opens the PR (so that
          # build-debug triggers) and enables auto-merge. Labels and the conflict
          # issue use GITHUB_TOKEN, which holds issues: write; the App has no
          # Issues permission.
          app_gh() { GH_TOKEN="$APP_TOKEN" gh "$@"; }
          repo_gh() { GH_TOKEN="$REPO_TOKEN" gh "$@"; }
          git remote add upstream "$UPSTREAM_URL"
          git fetch --quiet upstream main
          ahead=$(git rev-list --count HEAD..upstream/main)
          if [ "$ahead" -eq 0 ]; then
            echo "Nothing new upstream."
            echo "Upstream has nothing new for main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base=$(git merge-base HEAD upstream/main)
          review=no
          if [ -n "$(git diff --name-only "$base" upstream/main -- .github/)" ]; then review=yes; fi

          git config user.name "shockstruck-upstream-sync[bot]"
          git config user.email "noreply@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH" origin/main
          if ! git merge --no-ff -m "Merge netbirdio/android-client main" upstream/main; then
            git merge --abort || true
            repo_gh label create upstream-sync-conflict --color B60205 \
              --description "Upstream sync could not merge cleanly" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
            body="Merging netbirdio/android-client main (${ahead} new commits, head $(git rev-parse --short upstream/main)) into main conflicts. Resolve it by hand. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            existing=$(repo_gh issue list -R "$GITHUB_REPOSITORY" --label upstream-sync-conflict --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              repo_gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"
            else
              repo_gh issue create -R "$GITHUB_REPOSITORY" --label upstream-sync-conflict \
                --title "Upstream sync conflict" --body "$body"
            fi
            exit 1
          fi

          git push --force-with-lease origin "$SYNC_BRANCH"

          repo_gh label create upstream-sync-review --color FBCA04 \
            --description "Upstream delta touches .github/: human merge required" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          pr_body="Merge of netbirdio/android-client main (${ahead} new commits). Upstream delta touches .github/: ${review}. Merge as a merge commit, never squash."
          pr=$(app_gh pr list -R "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            app_gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" -f body="$pr_body" > /dev/null
          else
            app_gh pr create -R "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base main \
              --title "Merge upstream netbirdio/android-client main" --body "$pr_body"
            pr=$(app_gh pr list -R "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number')
          fi

          if [ "$review" = yes ]; then
            repo_gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/labels" -f 'labels[]=upstream-sync-review' > /dev/null
            app_gh pr merge "$pr" -R "$GITHUB_REPOSITORY" --disable-auto 2>/dev/null || true
            echo "PR #${pr} touches .github/: left for a human merge." >> "$GITHUB_STEP_SUMMARY"
          else
            repo_gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${pr}/labels/upstream-sync-review" > /dev/null 2>&1 || true
            app_gh pr merge "$pr" -R "$GITHUB_REPOSITORY" --auto --merge
            echo "PR #${pr} set to auto-merge as a merge commit once build-debug is green." >> "$GITHUB_STEP_SUMMARY"
          fi
