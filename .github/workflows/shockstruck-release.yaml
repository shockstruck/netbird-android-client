name: shockstruck release

# Fork-only. Builds the release APK unsigned in a job that holds no secrets,
# then signs it in a separate job that runs only Android SDK tools. No upstream
# code (Gradle, the composite action) ever runs where the keystore exists.
# The sign job stays off until the repo variable SHOCKSTRUCK_RELEASE_ENABLED is
# 'true'; pull requests that touch this file prove the signing path with an
# ephemeral keystore and publish nothing.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/shockstruck-release.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: shockstruck-release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      apk_name: ${{ steps.collect.outputs.apk_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          upstream=$(gh api repos/netbirdio/android-client/releases/latest --jq .tag_name)
          upstream=${upstream#v}
          if ! [[ "$upstream" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected upstream release tag '$upstream'"
            exit 1
          fi
          # Upstream's Play version codes are two digits and grow by one per
          # release or snapshot run; the offset keeps fork codes far above them.
          version_code=$((100000 + RUN_NUMBER))
          version_name="${upstream}-shockstruck.${RUN_NUMBER}"
          {
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
            echo "tag=v${version_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Android
        id: build
        uses: ./.github/actions/build-android
        with:
          version_name: ${{ steps.version.outputs.version_name }}
          version_code: ${{ steps.version.outputs.version_code }}
          build_type: release

      - name: Collect unsigned APK
        id: collect
        env:
          APK_PATH: ${{ steps.build.outputs.apk_path }}
        run: |
          set -euo pipefail
          mkdir -p unsigned
          cp "$APK_PATH" unsigned/unsigned.apk
          echo "apk_name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-release-apk
          path: unsigned/unsigned.apk
          retention-days: 3
          if-no-files-found: error

  sign-dry-run:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-release-apk

      - name: Sign with an ephemeral keystore and verify
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -1)"
          export pass
          pass=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$RUNNER_TEMP/dry-run.jks" -storepass "$pass" -keypass "$pass" \
            -alias dryrun -keyalg RSA -keysize 3072 -validity 1 -dname "CN=shockstruck dry run"
          "$bt/zipalign" -P 16 -f 4 unsigned.apk aligned.apk
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/dry-run.jks" --ks-key-alias dryrun \
            --ks-pass env:pass --key-pass env:pass --out signed.apk aligned.apk
          "$bt/apksigner" verify --print-certs signed.apk
          "$bt/zipalign" -c -P 16 4 signed.apk

  sign:
    if: github.event_name != 'pull_request' && vars.SHOCKSTRUCK_RELEASE_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-release-apk

      - name: Sign and verify
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 KEYSTORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then
              echo "::error::release signing secret for $v is missing or empty"
              exit 1
            fi
          done
          bt="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -1)"
          ks="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          trap 'rm -f "$ks"' EXIT
          "$bt/zipalign" -P 16 -f 4 unsigned.apk aligned.apk
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASS --key-pass env:KEY_PASS --out "$APK_NAME" aligned.apk
          "$bt/apksigner" verify --print-certs "$APK_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$APK_NAME" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Fork build of upstream NetBird Android client at ${GITHUB_SHA}."
